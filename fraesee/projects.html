
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fraesee - about me</title>

    <link rel="icon" type="image/jpg" href="images/favicon.jpg">

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            overflow-x: hidden;
            overflow-y: auto;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 30px 15px 140px;

            color: #fff;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            text-align: center;

            box-sizing: border-box;

        }


        body {
            background-image: url("images/bgblack.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        h1 {
            font-size: clamp(30px, 5vw, 45px);
            margin-bottom: 10px;
        }

        p,
        tt {
            max-width: 1000px;
            padding: 0 15px;
        }

        a {
            color: #00bfff;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        a:hover {
            color: #ff007f;
            text-decoration: underline;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .homeimg {
            width: min(282px, 90vw);
            margin: 20px 0;
        }

        .aboutcont {
            width: min(1100px, 92%);
            background: rgba(17, 17, 17, 0.84);
            border: 2px solid #333;
            padding: 25px;
            box-sizing: border-box;
            text-align: left;
        }

        .contactbox {
            width: min(800px, 92%);
            background: rgba(17, 17, 17, 0.84);
            border: 2px solid #333;
            padding: 25px;
            box-sizing: border-box;
            text-align: left;
        }

        .tt {
            font-size: clamp(13px, 1.5vw, 15px);
        }

        .tts {
            font-size: clamp(18px, 2.8vw, 25px);
        }

        .tts2 {
            font-size: clamp(17px, 2.2vw, 20px);
        }

        .bt {
            color: #fff;
            font-size: 3px;
        }

        .imagerow,
        .imagerowb {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .imagerow {
            align-items: flex-start;
        }

        .imagerowb {
            align-items: center;
        }

        .imagerow img {
            width: min(150px, 22vw);
            height: 300px;
            object-fit: cover;
        }

        .imagerowb img {
            width: min(225px, 35vw);
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .blur-image {
            filter: blur(10px);
            cursor: pointer;
            transition: .3s;
        }

        .blur-image:hover {
            filter: blur(7px);
        }

        .blur-image.revealed {
            filter: blur(0);
        }

        .projects-container {
            width: min(1000px, 90%);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .project-card {
            background: rgba(17, 17, 17, .9);
            border: 2px solid #333;
            padding: 20px;
            text-align: left;
            transition: border-color .2s;
        }

        .project-card:hover {
            border-color: #00bfff;
        }

        .project-card img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .navbotum {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;

            max-width: 95%;
            padding: 12px 20px;

            background: #111;
            border: 2px solid #333;
            box-sizing: border-box;
        }

        .navbotum a {
            margin: 0;
            padding: 8px 16px;

            color: #fff;
            text-decoration: none;

            background: #222;
            border: 1px solid #222;
        }

        .navbotum a:hover {
            background: #333;
            color: #00bfff;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 20px;
                padding-bottom: 170px;
            }

            h1 img {
                width: 45px;
                height: auto;
            }

            .imagerow,
            .imagerowb {
                gap: 12px;
            }

            .navbotum {
                width: 95%;
                bottom: 10px;
            }

            .imagerow img {
                width: min(150px, 40vw);
                height: auto;
                aspect-ratio: 1 / 2;
            }

            .imagerowb img {
                width: min(225px, 42vw);
            }
        }
    </style>
</head>
