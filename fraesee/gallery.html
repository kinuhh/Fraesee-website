        body {

            text-align: left;

        .tt {

        .imagerow,

            display: flex;

            gap: 20px;

        }

        .imagerow {
            align-items: flex-start;
        }

        .imagerowb {
            align-items: center;
        }

        .imagerow img {
            width: min(250px, 40vw);
            height: 350px;
            object-fit: cover;
            cursor: pointer;
            transition: .2s;
        }

        .imagerow img:hover {
            transform: scale(1.03);
        }

        .imagerowb img {
            width: min(225px, 35vw);
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .blur-image {
            filter: blur(10px);
            cursor: pointer;
            transition: .3s;
        }

        .blur-image:hover {
            filter: blur(7px);
        }

        .blur-image.revealed {
            filter: blur(0);
        }

        .projectcontainer {
            width: min(1000px, 90%);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .projectcard {
            background: rgba(17, 17, 17, .9);
            border: 2px solid #333;
            padding: 20px;
            text-align: left;
            transition: border-color .2s;
        }

        .projectcard:hover {
            border-color: #00bfff;
        }

        .projectcard img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .navbotum {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;

            max-width: 95%;
            padding: 12px 20px;

            background: #111;
            border: 2px solid #333;
            box-sizing: border-box;
        }

        .navbotum a {
            margin: 0;
            padding: 8px 16px;

            color: #fff;
            text-decoration: none;

            background: #222;
            border: 1px solid #222;
        }

        .navbotum a:hover {
            background: #333;
            color: #00bfff;
            text-decoration: none;
        }

        .lbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);

            display: none;
            justify-content: center;
            align-items: center;

            z-index: 9999;
            cursor: pointer;
        }

        .lbox img {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
            cursor: default;
        }

        .lboxcon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #lbox-caption {
            margin: 0;
            max-width: 90vw;
            color: #fff;
            font-size: 18px;
            text-align: center;
        }

		.pagebox {
			width: min(1250px, calc(100% - 60px));

			background: rgba(17, 17, 17, 0.82);
			border: 2px solid #333;

			padding: 30px;
			margin: 20px auto;

			box-sizing: border-box;
		}

        .imagerow,
        .imagerowb {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px auto;

            max-width: 1200px;
            width: calc(100% - 80px);  
            /*calc us short for calculator xdxdxdxd*/
        }


        @media (max-width: 768px) {
            body {
                padding-top: 20px;
                padding-bottom: 170px;
            }

            h1 img {
                width: 45px;
                height: auto;
            }

            .navbotum {
                width: 95%;
                bottom: 10px;	
            }

            .imagerow img {
                width: min(150px, 40vw);
                height: auto;
                aspect-ratio: 1 / 2;
            }

            .imagerowb img {
                width: min(225px, 42vw);
            }
            
        }
    </style>

        function openImage(src, caption) {
            document.getElementById("lbox-img").src = src;

        }

        function closeImage() {
            document.getElementById("lbox").style.display = "none";
        }

        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") {
                closeImage();
            }
        });
